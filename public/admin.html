<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEBAZ Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Inter,Arial,sans-serif}.wrap{width:min(1240px,94%);margin:34px auto}.gold{color:#d7b66d}.card{background:linear-gradient(145deg,#111,#0b0b0b);border:1px solid #262626;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 16px 45px #0007}input,button{padding:13px 14px;border-radius:11px;border:1px solid #303030;background:#090909;color:#fff;font-size:14px}button{cursor:pointer;background:#d7b66d;color:#080808;border:0;font-weight:900}.login{max-width:430px;margin:12vh auto}.login h1{letter-spacing:3px}.login input{width:100%;margin:7px 0}.login button{width:100%;margin-top:9px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{letter-spacing:3px}.muted{color:#888;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.stat{font-size:30px;font-weight:900;margin-top:6px}.ok{color:#7ee2a8}.toolbar{display:flex;gap:10px;align-items:center}.toolbar input{min-width:250px}.table{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #242424;font-size:13px;white-space:nowrap}th{color:#d7b66d;font-size:11px;letter-spacing:.7px;text-transform:uppercase}tr:hover td{background:#ffffff05}.badge{padding:6px 10px;border:1px solid #4a4028;border-radius:999px;background:#d7b66d12;color:#e7ca88}.domain{font-weight:800}.empty{text-align:center;color:#777;padding:35px!important}@media(max-width:760px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.toolbar{width:100%;flex-wrap:wrap}.toolbar input{min-width:0;flex:1}.wrap{margin-top:18px}}</style></head><body><div class="wrap"><div id="loginBox" class="card login"><h1>ZEBAZ <span class="gold">ADMIN</span></h1><p class="muted">Secure Studio Management</p><input id="usernameInput" placeholder="Username" autocomplete="username"><input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password"><button id="loginButton">LOGIN</button><p id="errorBox" class="gold"></p></div><div id="dashboard" style="display:none"><div class="top"><div><h1 class="brand">ZEBAZ <span class="gold">ADMIN</span></h1><div class="muted">PPF Studio • Booking Management</div></div><button id="logoutButton">LOG OUT</button></div><div class="stats"><div class="card"><div class="muted">TOTAL REQUESTS</div><div id="requestCount" class="stat">0</div></div><div class="card"><div class="muted">DATABASE</div><div id="dbStatus" class="stat ok">CONNECTED</div></div><div class="card"><div class="muted">PRIMARY WEBSITE</div><div class="stat domain">zebaz.co</div></div></div><div class="card"><div class="top"><div><h2>Booking Requests</h2><div class="muted">Requests submitted from the ZEBAZ website</div></div><div class="toolbar"><input id="searchInput" placeholder="Search name, phone, car, VIN…"><button id="refreshButton">REFRESH</button></div></div><div class="table"><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Car</th><th>Year</th><th>VIN</th><th>Service</th><th>Notes</th><th>Language</th></tr></thead><tbody id="requestRows"></tbody></table></div></div></div></div><script>const byId=id=>document.getElementById(id);const loginBox=byId('loginBox'),dashboard=byId('dashboard'),errorBox=byId('errorBox');let bookings=[];function safe(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}function showLogin(){loginBox.style.display='block';dashboard.style.display='none'}function showDashboard(){loginBox.style.display='none';dashboard.style.display='block'}function render(){const q=byId('searchInput').value.trim().toLowerCase();const rows=bookings.filter(b=>!q||[b.name,b.phone,b.car,b.year,b.vin,b.service,b.notes,b.language].some(v=>String(v||'').toLowerCase().includes(q)));byId('requestRows').innerHTML=rows.map(b=>'<tr><td>'+safe(b.date||new Date(b.receivedAt).toLocaleString())+'</td><td><b>'+safe(b.name)+'</b></td><td>'+safe(b.phone)+'</td><td>'+safe(b.car)+'</td><td>'+safe(b.year)+'</td><td>'+safe(b.vin)+'</td><td><span class="badge">'+safe(b.service)+'</span></td><td>'+safe(b.notes)+'</td><td>'+safe(b.language||'—')+'</td></tr>').join('')||'<tr><td colspan="9" class="empty">No matching requests.</td></tr>'}async function doLogin(){errorBox.textContent='';const btn=byId('loginButton');btn.disabled=true;try{const r=await fetch('/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:byId('usernameInput').value.trim(),password:byId('passwordInput').value})});if(!r.ok){errorBox.textContent='Wrong username or password';return}showDashboard();await loadDashboard()}catch(e){errorBox.textContent='Connection error'}finally{btn.disabled=false}}async function loadDashboard(){try{const r=await fetch('/admin/api/bookings',{credentials:'same-origin',cache:'no-store'});if(r.status===401){showLogin();return}if(!r.ok)throw new Error();const j=await r.json();bookings=j.bookings||[];showDashboard();byId('requestCount').textContent=bookings.length;byId('dbStatus').textContent=j.databaseReady?'CONNECTED':'ERROR';byId('dbStatus').className='stat '+(j.databaseReady?'ok':'gold');render()}catch(e){byId('dbStatus').textContent='ERROR';byId('dbStatus').className='stat gold'}}async function doLogout(){await fetch('/admin/logout',{method:'POST',credentials:'same-origin'});showLogin()}byId('loginButton').addEventListener('click',doLogin);byId('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});byId('refreshButton').addEventListener('click',loadDashboard);byId('logoutButton').addEventListener('click',doLogout);byId('searchInput').addEventListener('input',render);loadDashboard();</script></body></html>
