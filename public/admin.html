<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEBAZ Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#060606;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:45px auto}.gold{color:#d7b66d}.card{background:#111;border:1px solid #292929;border-radius:22px;padding:24px;margin-bottom:20px}input,button{padding:14px;border-radius:12px;border:1px solid #333;background:#080808;color:#fff;font-size:15px}button{cursor:pointer;background:#d7b66d;color:#080808;font-weight:900}.login{max-width:430px;margin:12vh auto}.login input{width:100%;margin:7px 0}.login button{width:100%;margin-top:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{font-size:28px;font-weight:900}.muted{color:#888;font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:13px;border-bottom:1px solid #292929;font-size:14px}th{color:#d7b66d}.badge{padding:6px 10px;border:1px solid #444;border-radius:999px;display:inline-block}#qrBox img{max-width:280px;background:#fff;padding:10px;border-radius:15px}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div id="loginBox" class="card login"><h1>ZEBAZ <span class="gold">ADMIN</span></h1><p class="muted">Private management panel</p><input id="usernameInput" placeholder="Username" autocomplete="username"><input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password"><button id="loginButton">LOGIN</button><p id="errorBox" class="gold"></p></div><div id="dashboard" style="display:none"><div class="top"><div><h1>ZEBAZ <span class="gold">ADMIN</span></h1><div class="muted">PPF Studio Management</div></div><button id="logoutButton">LOG OUT</button></div><div class="stats"><div class="card"><div class="muted">TOTAL REQUESTS</div><div id="requestCount" class="stat">0</div></div><div class="card"><div class="muted">WHATSAPP</div><div id="waStatus" class="stat">—</div></div></div><div class="card"><div class="top"><div><h2>Booking Requests</h2><div class="muted">All website requests appear here</div></div><button id="refreshButton">REFRESH</button></div><div class="table"><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Car</th><th>Year</th><th>VIN</th><th>Service</th><th>Notes</th></tr></thead><tbody id="requestRows"></tbody></table></div></div><div class="card"><h2>WhatsApp Connection</h2><div id="qrBox"></div></div></div></div><script>
const byId=(id)=>document.getElementById(id);
const loginBox=byId('loginBox'),dashboard=byId('dashboard'),errorBox=byId('errorBox');
function safe(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
function showLogin(){loginBox.style.display='block';dashboard.style.display='none'}
function showDashboard(){loginBox.style.display='none';dashboard.style.display='block'}
async function doLogin(){errorBox.textContent='';const btn=byId('loginButton');btn.disabled=true;try{const r=await fetch('/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:byId('usernameInput').value.trim(),password:byId('passwordInput').value})});if(!r.ok){errorBox.textContent='Wrong username or password';return}showDashboard();await loadDashboard()}catch(e){errorBox.textContent='Connection error'}finally{btn.disabled=false}}
async function loadDashboard(){try{const r=await fetch('/admin/api/bookings',{credentials:'same-origin',cache:'no-store'});if(r.status===401){showLogin();return}const j=await r.json();showDashboard();byId('requestCount').textContent=(j.bookings||[]).length;byId('waStatus').textContent=j.whatsappReady?'CONNECTED ✅':'NOT CONNECTED';byId('requestRows').innerHTML=(j.bookings||[]).map(b=>'<tr><td>'+safe(b.date||b.receivedAt)+'</td><td>'+safe(b.name)+'</td><td>'+safe(b.phone)+'</td><td>'+safe(b.car)+'</td><td>'+safe(b.year)+'</td><td>'+safe(b.vin)+'</td><td><span class="badge">'+safe(b.service)+'</span></td><td>'+safe(b.notes)+'</td></tr>').join('')||'<tr><td colspan="8">No requests yet.</td></tr>';const q=await fetch('/admin/api/qr',{credentials:'same-origin',cache:'no-store'});if(q.ok){const x=await q.json();const box=byId('qrBox');if(x.ready)box.innerHTML='<b>WhatsApp connected ✅</b>';else if(x.qr){box.innerHTML='<p>WhatsApp → Linked devices → Link a device</p><img alt="WhatsApp QR">';box.querySelector('img').src=x.qr}else box.textContent='Waiting for QR…'}}catch(e){byId('waStatus').textContent='ERROR'}}
async function doLogout(){await fetch('/admin/logout',{method:'POST',credentials:'same-origin'});showLogin()}
byId('loginButton').addEventListener('click',doLogin);byId('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});byId('refreshButton').addEventListener('click',loadDashboard);byId('logoutButton').addEventListener('click',doLogout);loadDashboard();
</script></body></html>
