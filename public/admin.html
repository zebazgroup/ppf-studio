<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEBAZ Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#060606;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1180px,92%);margin:45px auto}.gold{color:#d7b66d}.card{background:#111;border:1px solid #292929;border-radius:22px;padding:24px;margin-bottom:20px}input,button{padding:14px;border-radius:12px;border:1px solid #333;background:#080808;color:#fff;font-size:15px}button{cursor:pointer;background:#d7b66d;color:#080808;font-weight:900}.login{max-width:430px;margin:12vh auto}.login input{width:100%;margin:7px 0}.login button{width:100%;margin-top:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{font-size:28px;font-weight:900}.muted{color:#888;font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:13px;border-bottom:1px solid #292929;font-size:14px}th{color:#d7b66d}.badge{padding:6px 10px;border:1px solid #444;border-radius:999px;display:inline-block}#qr img{max-width:280px;background:#fff;padding:10px;border-radius:15px}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div id="login" class="card login"><h1>ZEBAZ <span class="gold">ADMIN</span></h1><p class="muted">Private management panel</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">LOGIN</button><p id="err" class="gold"></p></div><div id="dash" style="display:none"><div class="top"><div><h1>ZEBAZ <span class="gold">ADMIN</span></h1><div class="muted">PPF Studio Management</div></div><button onclick="logout()">LOG OUT</button></div><div class="stats"><div class="card"><div class="muted">TOTAL REQUESTS</div><div id="count" class="stat">0</div></div><div class="card"><div class="muted">WHATSAPP</div><div id="wa" class="stat">—</div></div></div><div class="card"><div class="top"><div><h2>Booking Requests</h2><div class="muted">All website requests appear here</div></div><button onclick="load()">REFRESH</button></div><div class="table"><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Car</th><th>Year</th><th>VIN</th><th>Service</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>WhatsApp Connection</h2><div id="qr"></div></div></div></div><script>async function login(){err.textContent='';const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(!r.ok){err.textContent='Wrong username or password';return}login.style.display='none';dash.style.display='block';load()}async function load(){const r=await fetch('/admin/api/bookings');if(r.status===401){login.style.display='block';dash.style.display='none';return}const j=await r.json();count.textContent=j.bookings.length;wa.textContent=j.whatsappReady?'CONNECTED ✅':'NOT CONNECTED';rows.innerHTML=j.bookings.map(b=>`<tr><td>${esc(b.date||b.receivedAt||'')}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${esc(b.car)}</td><td>${esc(b.year)}</td><td>${esc(b.vin)}</td><td><span class="badge">${esc(b.service)}</span></td><td>${esc(b.notes)}</td></tr>`).join('')||'<tr><td colspan="8">No requests yet.</td></tr>';const q=await fetch('/admin/api/qr');const x=await q.json();qr.innerHTML=x.ready?'<b>WhatsApp connected ✅</b>':x.qr?`<p>WhatsApp → Linked devices → Link a device</p><img src="${x.qr}">`:'Waiting for QR…'}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function logout(){await fetch('/admin/logout',{method:'POST'});location.reload()}load();</script></body></html>
