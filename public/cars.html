<body class="zc-v2" data-title-ku="ZEBAZ Cars | بازاڕی ئۆتۆمبێل" data-title-ar="ZEBAZ Cars | سوق السيارات" data-title-en="ZEBAZ Cars | Car Marketplace">
<header class="c-top">
  <div class="c-wrap c-top-in">
    <a href="/cars" aria-label="ZEBAZ Cars"><img class="c-logo" src="/zebaz-logo-black.svg?v=2" alt="ZEBAZ"></a>
    <nav class="c-nav">
      <a class="active" href="/cars" data-ku="ئۆتۆمبێلەکان" data-ar="السيارات" data-en="Cars"></a>
      <a href="#brands" data-ku="مارکەکان" data-ar="الماركات" data-en="Brands"></a>
      <a href="#listings" data-ku="بەکارهاتوو" data-ar="مستعملة" data-en="Used Cars"></a>
      <a href="/ai">ZEBAZ AI</a>
    </nav>
    <div class="c-actions">
      <button class="c-btn c-city-btn" type="button">⌖ <span data-ku="هەموو شارەکان" data-ar="كل المدن" data-en="All Cities"></span></button>
      <button class="c-btn icon" id="topSearch" type="button" aria-label="Search">⌕</button>
      <button class="c-btn primary" id="topSell" type="button">＋ <span data-ku="فرۆشتن" data-ar="بيع" data-en="Sell"></span></button>
    </div>
  </div>
</header>
<section class="c-hero">
  <div class="c-wrap">
    <div class="c-hero-card">
      <div>
        <div class="c-eyebrow">ZEBAZ CARS • AI MARKETPLACE</div>
        <h1 data-ku="ئۆتۆمبێلەکەت بدۆزەوە." data-ar="اعثر على سيارتك." data-en="FIND YOUR NEXT CAR."></h1>
        <p data-ku="بازاڕێکی خێرا و پاک بۆ کڕین و فرۆشتنی ئۆتۆمبێل؛ بە گەڕانی زیرەک، وێنەی AI، بەراورد و ڕاوێژکاری ZEBAZ AI." data-ar="سوق سريع واحترافي لشراء وبيع السيارات مع بحث ذكي وصور AI ومقارنة ومستشار ZEBAZ AI." data-en="A fast, professional car marketplace with smart search, AI photos, comparison and ZEBAZ AI guidance."></p>
        <div class="c-quick">
          <button class="c-btn primary" id="openSell" type="button" data-ku="+ ئۆتۆمبێلەکەت بفرۆشە" data-ar="+ بع سيارتك" data-en="+ Sell your car"></button>
          <button class="c-btn" id="openAI" type="button">✦ <span data-ku="پرسیار لە ZEBAZ AI" data-ar="اسأل ZEBAZ AI" data-en="Ask ZEBAZ AI"></span></button>
        </div>
      </div>
      <div class="c-hero-art" aria-hidden="true"></div>
    </div>
  </div>
</section>
<div class="c-search-shell">
  <div class="c-wrap">
    <section class="c-search" id="searchPanel">
      <div class="c-search-head"><b data-ku="گەڕانی پێشکەوتوو" data-ar="بحث متقدم" data-en="Advanced Search"></b><button class="c-btn desktop-only" id="mobileSearch" type="button">⌕ <span data-ku="گەڕان" data-ar="بحث" data-en="Search"></span></button></div>
      <div class="c-search-grid">
        <div class="c-field"><label data-ku="شار" data-ar="المدينة" data-en="City"></label><select id="zcCity"><option value=""></option></select></div>
        <div class="c-field"><label data-ku="مارکە" data-ar="الماركة" data-en="Make"></label><select id="zcMake"><option value="" data-ku="هەموو مارکەکان" data-ar="كل الماركات" data-en="All makes"></option></select></div>
        <div class="c-field"><label data-ku="مۆدێل" data-ar="الموديل" data-en="Model"></label><select id="zcModel"><option value=""></option></select></div>
        <div class="c-field"><label data-ku="ساڵ" data-ar="السنة" data-en="Year"></label><select id="zcYear"><option value=""></option></select></div>
        <div class="c-field"><label data-ku="کارکرد تا" data-ar="المسافة حتى" data-en="Mileage up to"></label><input id="zcMileage" inputmode="numeric" placeholder="200,000"></div>
        <div class="c-field"><label data-ku="نرخ تا" data-ar="السعر حتى" data-en="Price up to"></label><input id="zcPrice" inputmode="numeric" placeholder="100,000"></div>
        <button class="c-btn primary c-search-go" id="searchGo" type="button">⌕ <span data-ku="گەڕان" data-ar="بحث" data-en="Search"></span></button>
      </div>
    </section>
  </div>
</div>
<main class="c-wrap c-main">
  <section class="c-section" id="brands">
    <div class="c-section-head"><div><h2 data-ku="مارکە بەردەستەکان" data-ar="أشهر الماركات" data-en="Popular Brands"></h2><p data-ku="مارکەکە هەڵبژێرە بۆ فلتەرکردنی خێرا." data-ar="اختر الماركة لتصفية سريعة." data-en="Choose a brand for instant filtering."></p></div></div>
    <div class="c-brand-rail" id="brandRail"></div>
  </section>
  <section class="c-section">
    <div class="c-section-head"><div><h2 data-ku="ئامرازە زیرەکەکان" data-ar="أدوات ذكية" data-en="Smart Tools"></h2><p data-ku="AI بۆ بەراورد، نرخ و هەڵبژاردنی ئۆتۆمبێل." data-ar="AI للمقارنة والسعر واختيار السيارة." data-en="AI for comparison, value and buying decisions."></p></div></div>
    <div class="c-tools">
      <button class="c-tool" type="button" data-ai-prompt="Help me choose the best car for my budget and needs in Iraq. Ask me the minimum questions needed, then recommend the best options."><span class="ico">✦</span><strong data-ku="یارمەتی هەڵبژاردن" data-ar="ساعدني أختار" data-en="Help Me Choose"></strong><span data-ku="ZEBAZ AI پێشنیاری گونجاوت پێدەدات." data-ar="ZEBAZ AI يقترح الأنسب لك." data-en="ZEBAZ AI recommends the right options."></span></button>
      <button class="c-tool" id="compareTool" type="button"><span class="ico">⇄</span><strong><span data-ku="بەراوردی AI" data-ar="مقارنة AI" data-en="AI Compare"></span> <small id="compareCount">0</small></strong><span data-ku="دوو ئۆتۆمبێل هەڵبژێرە و AI بەراوردیان دەکات." data-ar="اختر سيارتين وسيقارن AI بينهما." data-en="Select two cars and let AI compare them."></span></button>
      <button class="c-tool" type="button" data-ai-prompt="Estimate a fair market price for my car in Iraq/Kurdistan. Ask me make, model, year, mileage, condition, trim and city, then give me a practical price range."><span class="ico">$</span><strong data-ku="نرخی ئۆتۆمبێل" data-ar="قيمة السيارة" data-en="Car Value"></strong><span data-ku="مەودای نرخێکی بازاڕ بە AI." data-ar="تقدير نطاق السعر بالذكاء الاصطناعي." data-en="AI-powered market value guidance."></span></button>
      <button class="c-tool" id="viewFavorites" type="button"><span class="ico">♡</span><strong><span data-ku="دڵخوازەکان" data-ar="المفضلة" data-en="Favorites"></span> <small id="favCount">0</small></strong><span data-ku="ئۆتۆمبێلە پاشەکەوتکراوەکانت ببینە." data-ar="شاهد السيارات المحفوظة." data-en="View your saved cars."></span></button>
    </div>
  </section>
  <section class="c-section" id="listings">
    <div class="c-section-head c-listbar"><div><h2 data-ku="ئۆتۆمبێلە بەردەستەکان" data-ar="السيارات المعروضة" data-en="Cars for Sale"></h2><span class="count" id="carCount">0</span></div><div class="c-list-actions"><input id="globalSearch" class="c-btn" style="width:210px" data-ku-placeholder="گەڕان..." data-ar-placeholder="بحث..." data-en-placeholder="Search..."><button class="c-btn" id="clearFilters" type="button" data-ku="پاککردنەوە" data-ar="مسح" data-en="Reset"></button></div></div>
    <div class="c-grid" id="carsGrid"></div>
    <div class="c-more"><button class="c-btn" id="loadMore" type="button" hidden></button></div>
  </section>
</main>
<div class="c-modal" id="detailModal"><div class="c-sheet"><div class="c-sheet-head"><h2 id="detailTitle"></h2><button class="c-close" type="button">×</button></div><div id="detailBody"></div></div></div>
<div class="c-modal" id="sellModal"><div class="c-sheet"><div class="c-sheet-head"><div><div class="c-eyebrow">ZEBAZ CARS</div><h2 data-ku="ئۆتۆمبێلەکەت بفرۆشە" data-ar="بع سيارتك" data-en="Sell your car"></h2></div><button class="c-close" type="button">×</button></div><form class="c-form" id="sellForm"><div class="c-form-grid">
<div class="c-field"><label data-ku="ناوی فرۆشیار" data-ar="اسم البائع" data-en="Seller name"></label><input id="sellerName" required autocomplete="name"></div>
<div class="c-field"><label data-ku="ژمارەی مۆبایل" data-ar="رقم الهاتف" data-en="Phone"></label><input id="sellerPhone" required type="tel" autocomplete="tel"></div>
<div class="c-field"><label data-ku="مارکە" data-ar="الماركة" data-en="Make"></label><input id="make" required></div>
<div class="c-field"><label data-ku="مۆدێل" data-ar="الموديل" data-en="Model"></label><input id="model" required></div>
<div class="c-field"><label><span data-ku="ساڵ" data-ar="السنة" data-en="Year"></span><span class="c-opt" data-ku="ئارەزوومەندانە" data-ar="اختياري" data-en="Optional"></span></label><input id="year" inputmode="numeric"></div>
<div class="c-field"><label data-ku="نرخ" data-ar="السعر" data-en="Price"></label><input id="price" required inputmode="decimal" placeholder="$ 65,000"></div>
<div class="c-field"><label data-ku="کیلۆمەتر" data-ar="المسافة" data-en="Mileage"></label><input id="mileage" inputmode="numeric" placeholder="25,000 km"></div>
<div class="c-field"><label data-ku="شار" data-ar="المدينة" data-en="City"></label><input id="city" required placeholder="Erbil"></div>
<div class="c-field"><label data-ku="ڕەنگ" data-ar="اللون" data-en="Color"></label><input id="color"></div>
<div class="c-field"><label>VIN <span class="c-opt" data-ku="ئارەزوومەندانە" data-ar="اختياري" data-en="Optional"></span></label><input id="vin" maxlength="17" style="direction:ltr;text-transform:uppercase"></div>
</div><div class="c-upload"><div class="c-upload-top"><div><strong data-ku="وێنەکانی ئۆتۆمبێل — تا 5" data-ar="صور السيارة — حتى 5" data-en="Car photos — up to 5"></strong><div style="font-size:10px;color:var(--c-muted);margin-top:4px" data-ku="AI ئۆتۆمبێلەکە target دەکات و وێنەکان 1:1 ئامادە دەکات." data-ar="AI يحدد السيارة ويجهز الصور 1:1." data-en="AI targets the vehicle and prepares clean 1:1 photos."></div></div><button class="c-btn primary" id="pickPhotos" type="button" data-ku="+ وێنە" data-ar="+ صور" data-en="+ Photos"></button></div><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><div class="c-thumbs" id="photoGrid"></div></div><div class="c-field"><label data-ku="تێبینی" data-ar="ملاحظات" data-en="Description"></label><textarea id="description"></textarea></div><button class="c-btn primary" id="submitListing" type="submit" data-ku="ناردن بۆ پشکنین" data-ar="إرسال للمراجعة" data-en="Send for review"></button><div class="c-form-status" id="sellStatus"></div></form></div></div>
<div class="c-modal" id="aiModal"><div class="c-sheet small"><div class="c-sheet-head"><div><div class="c-eyebrow">ZEBAZ AI</div><h2 data-ku="ڕاوێژکاری ئۆتۆمبێل" data-ar="مستشار السيارات" data-en="Car Advisor"></h2></div><button class="c-close" type="button">×</button></div><div class="c-ai-quick"><button type="button" data-ai-prompt="Help me choose a car for my budget in Iraq.">Choose Car</button><button type="button" data-ai-prompt="Estimate my car's market value in Iraq.">Car Value</button><button type="button" data-ai-prompt="Which SUV is best for Kurdistan roads, reliability and resale value?">SUV Advice</button></div><div class="c-ai-chat" id="aiMessages"><div class="c-msg ai" data-ku="سڵاو، من ZEBAZ AI ـم. دەتوانم لە هەڵبژاردن، بەراورد، نرخ و پرسیارەکانی ئۆتۆمبێل یارمەتیت بدەم." data-ar="مرحباً، أنا ZEBAZ AI. أساعدك في الاختيار والمقارنة والسعر وأسئلة السيارات." data-en="Hi, I'm ZEBAZ AI. I can help with choosing, comparing, pricing and car questions."></div></div><div class="c-ai-compose"><input id="aiInput" data-ku-placeholder="پرسیارێک بنووسە..." data-ar-placeholder="اكتب سؤالك..." data-en-placeholder="Ask a car question..."><button class="c-btn primary" id="aiSend" type="button">↑</button></div></div></div>
<nav class="c-bottom"><button class="active" id="bottomHome" type="button"><span class="ico">⌂</span><span data-ku="سەرەکی" data-ar="الرئيسية" data-en="Home"></span></button><button id="bottomBrands" type="button"><span class="ico">◫</span><span data-ku="مارکە" data-ar="ماركات" data-en="Brands"></span></button><button class="sell" id="bottomSell" type="button"><span class="ico">＋</span><span data-ku="فرۆشتن" data-ar="بيع" data-en="Sell"></span></button><button id="bottomFav" type="button"><span class="ico">♡</span><span data-ku="دڵخواز" data-ar="المفضلة" data-en="Favorites"></span></button><button id="bottomAI" type="button"><span class="ico">✦</span><span>AI</span></button></nav>
<div class="c-toast" id="cToast"></div>

<script src="/car-catalog.js?v=4"></script>

</body>
</html>
