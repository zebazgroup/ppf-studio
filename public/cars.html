<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>ZEBAZ Cars | بازاڕی ئۆتۆمبێل</title><meta name="description" content="ZEBAZ Cars - buy and sell cars in Kurdistan and Iraq with smart AI photo presentation."><link rel="canonical" href="https://zebaz.co/cars"><link rel="stylesheet" href="/division.css"><style>
:root{--gold:#d7b66d;--bg:#050505;--surface:#0d0d0d;--line:#292929;--text:#f5f5f5;--muted:#8e8e8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}.zc-shell{width:min(1240px,94%);margin:auto}.zc-hero{padding:86px 0 28px;background:radial-gradient(circle at 80% 10%,#d7b66d18,transparent 30%),#050505}.zc-kicker{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:900}.zc-hero h1{font-size:clamp(34px,6vw,72px);line-height:.95;margin:12px 0}.zc-hero p{max-width:650px;color:#a3a3a3;line-height:1.8}.zc-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.zc-btn{border:1px solid #3a3a3a;background:#101010;color:#fff;border-radius:13px;padding:12px 16px;font:inherit;font-size:12px;font-weight:900;cursor:pointer;text-decoration:none}.zc-btn.gold{background:var(--gold);border-color:var(--gold);color:#070707}.zc-searchbar{position:sticky;top:8px;z-index:40;margin:0 auto 22px;display:grid;grid-template-columns:1.7fr repeat(3,1fr) auto;gap:8px;padding:9px;border:1px solid #252525;border-radius:18px;background:#090909ee;backdrop-filter:blur(18px);box-shadow:0 16px 50px #0008}.zc-searchbar input,.zc-searchbar select{width:100%;min-width:0;border:1px solid #2f2f2f;background:#0c0c0c;color:#fff;border-radius:11px;padding:11px 12px;outline:none;font:inherit;font-size:12px}.zc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;padding-bottom:80px}.zc-card{border:1px solid #242424;border-radius:18px;overflow:hidden;background:#0b0b0b;cursor:pointer;transition:.18s}.zc-card:hover{transform:translateY(-3px);border-color:#6b5727}.zc-photo{aspect-ratio:1.22;background:#111 center/cover no-repeat;position:relative}.zc-price{position:absolute;bottom:9px;inset-inline-start:9px;background:#060606dd;border:1px solid #343434;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.zc-ai{position:absolute;top:9px;inset-inline-end:9px;background:#d7b66dea;color:#080808;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:1000}.zc-body{padding:12px}.zc-body h3{font-size:14px;margin:0 0 6px}.zc-meta{color:#888;font-size:10px;display:flex;flex-wrap:wrap;gap:7px}.zc-empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:#777;border:1px dashed #333;border-radius:18px}.zc-modal{position:fixed;inset:0;z-index:9998;background:#000d;backdrop-filter:blur(12px);display:none;align-items:flex-end;justify-content:center;padding:10px}.zc-modal.open{display:flex}.zc-sheet{width:min(880px,100%);max-height:94vh;overflow:auto;border:1px solid #2b2b2b;border-radius:26px 26px 18px 18px;background:#0a0a0a;padding:18px;box-shadow:0 30px 100px #000}.zc-sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.zc-sheet-head h2{margin:0;font-size:22px}.zc-close{width:38px;height:38px;border-radius:50%;border:1px solid #333;background:#111;color:#fff;font-size:22px;cursor:pointer}.zc-form{display:grid;gap:10px;margin-top:14px}.zc-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.zc-field label{display:flex;align-items:center;gap:6px;color:#aaa;font-size:10px;font-weight:800;margin-bottom:5px}.zc-opt{font-size:8px;border:1px solid #333;border-radius:999px;padding:2px 6px;color:#777}.zc-field input,.zc-field select,.zc-field textarea{width:100%;border:1px solid #303030;background:#080808;color:#fff;border-radius:11px;padding:11px 12px;outline:none;font:inherit;font-size:13px}.zc-field textarea{min-height:80px;resize:vertical}.zc-photos{border:1px dashed #393939;border-radius:16px;padding:12px}.zc-photo-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.zc-photo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.zc-thumb{position:relative;aspect-ratio:1;border:1px solid #2b2b2b;border-radius:12px;overflow:hidden;background:#111}.zc-thumb img{width:100%;height:100%;object-fit:cover}.zc-thumb button{position:absolute;top:5px;inset-inline-end:5px;width:23px;height:23px;border:0;border-radius:50%;background:#050505e8;color:#fff;cursor:pointer}.zc-thumb span{position:absolute;bottom:5px;inset-inline-start:5px;background:#050505dc;border-radius:999px;padding:3px 6px;color:var(--gold);font-size:8px;font-weight:900}.zc-help{font-size:10px;color:#777;line-height:1.7;margin-top:7px}.zc-status{min-height:18px;font-size:11px;color:var(--gold)}.zc-detail-gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px;margin:12px 0}.zc-detail-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid #2b2b2b}.zc-detail-gallery img:first-child{grid-row:span 2}.zc-detail-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.zc-chip{border:1px solid #292929;border-radius:12px;padding:10px;background:#0d0d0d}.zc-chip small{display:block;color:#777;font-size:9px}.zc-chip b{font-size:12px}.zc-contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.zc-contact a{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:12px;background:var(--gold);color:#070707;font-weight:900;font-size:12px;min-width:160px}

</style></head><body data-title-ku="ZEBAZ Cars | بازاڕی ئۆتۆمبێل" data-title-ar="ZEBAZ Cars | سوق السيارات" data-title-en="ZEBAZ Cars | Car Marketplace">
<section class="zc-hero"><div class="zc-shell"><div class="zc-kicker">ZEBAZ CARS • AI MARKETPLACE</div><h1 data-ku="بازاڕی ئۆتۆمبێل." data-ar="سوق السيارات." data-en="CAR MARKETPLACE."></h1><p data-ku="ئۆتۆمبێلەکەت پیشان بدە یان ئۆتۆمبێلی دڵخوازت بدۆزەوە. وێنەکان بە AI Smart Photo خۆکارانە 1:1 و ڕێکخراو دەکرێن." data-ar="اعرض سيارتك أو ابحث عن سيارتك القادمة. تتم معالجة الصور تلقائياً بنظام AI Smart Photo إلى إطار 1:1 مرتب." data-en="List your car or find your next one. AI Smart Photo automatically prepares clean 1:1 listing images."></p><div class="zc-actions"><button class="zc-btn gold" id="openSell" data-ku="+ ئۆتۆمبێل بنێرە" data-ar="+ اعرض سيارتك" data-en="+ Sell your car"></button><a class="zc-btn" href="#cars" data-ku="بینینی ئۆتۆمبێلەکان" data-ar="تصفح السيارات" data-en="Browse cars"></a></div></div></section>
<main class="zc-shell" id="cars"><div class="zc-searchbar"><input id="search" data-ku-placeholder="گەڕان بە براند، مۆدێل..." data-ar-placeholder="ابحث بالماركة أو الموديل..." data-en-placeholder="Search make or model..."><select id="makeFilter"><option value="" data-ku="هەموو براندەکان" data-ar="كل الماركات" data-en="All makes"></option></select><select id="yearFilter"><option value="" data-ku="هەموو ساڵەکان" data-ar="كل السنوات" data-en="All years"></option></select><select id="cityFilter"><option value="" data-ku="هەموو شارەکان" data-ar="كل المدن" data-en="All cities"></option></select><button class="zc-btn" id="clearFilters" data-ku="پاککردنەوە" data-ar="مسح" data-en="Reset"></button></div><div id="carsGrid" class="zc-grid"><div class="zc-empty">Loading...</div></div></main>
<div class="zc-modal" id="sellModal"><div class="zc-sheet"><div class="zc-sheet-head"><div><div class="zc-kicker">ZEBAZ CARS</div><h2 data-ku="ئۆتۆمبێلەکەت پیشان بدە" data-ar="اعرض سيارتك" data-en="List your car"></h2></div><button class="zc-close" type="button">×</button></div><form id="sellForm" class="zc-form"><div class="zc-form-grid"><div class="zc-field"><label data-ku="ناوی فرۆشیار" data-ar="اسم البائع" data-en="Seller name"></label><input id="sellerName" required autocomplete="name"></div><div class="zc-field"><label data-ku="ژمارەی مۆبایل" data-ar="رقم الهاتف" data-en="Phone"></label><input id="sellerPhone" required type="tel" autocomplete="tel"></div><div class="zc-field"><label data-ku="براند" data-ar="الماركة" data-en="Make"></label><input id="make" required placeholder="Toyota"></div><div class="zc-field"><label data-ku="مۆدێل" data-ar="الموديل" data-en="Model"></label><input id="model" required placeholder="Land Cruiser"></div><div class="zc-field"><label data-ku="ساڵ" data-ar="السنة" data-en="Year"></label><input id="year" required inputmode="numeric" placeholder="2024"></div><div class="zc-field"><label data-ku="نرخ" data-ar="السعر" data-en="Price"></label><input id="price" required inputmode="decimal" placeholder="$ 65,000"></div><div class="zc-field"><label data-ku="کیلۆمەتر" data-ar="المسافة" data-en="Mileage"></label><input id="mileage" inputmode="numeric" placeholder="25,000 km"></div><div class="zc-field"><label data-ku="شار" data-ar="المدينة" data-en="City"></label><input id="city" required placeholder="Erbil"></div><div class="zc-field"><label data-ku="ڕەنگ" data-ar="اللون" data-en="Color"></label><input id="color" placeholder="Black"></div><div class="zc-field"><label><span>VIN</span><span class="zc-opt" data-ku="ئارەزوومەندانە" data-ar="اختياري" data-en="Optional"></span></label><input id="vin" maxlength="17" style="direction:ltr;text-transform:uppercase"></div></div><div class="zc-photos"><div class="zc-photo-head"><label data-ku="وێنەکانی ئۆتۆمبێل — تا 5" data-ar="صور السيارة — حتى 5" data-en="Car photos — up to 5"></label><button type="button" id="pickPhotos" class="zc-btn gold" data-ku="+ وێنە" data-ar="+ صور" data-en="+ Photos"></button></div><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><div class="zc-help" data-ku="AI Smart Photo ئۆتۆمبێلەکە دەناسێتەوە، فوکەسەکەی ڕێکدەخات و هەر وێنەیەک بە شێوەی 1:1 ئامادە دەکات." data-ar="AI Smart Photo يحدد السيارة ويضبط التركيز ويجهز كل صورة تلقائياً بنسبة 1:1." data-en="AI Smart Photo finds the vehicle focus and prepares every image automatically in 1:1."></div><div id="photoGrid" class="zc-photo-grid"></div></div><div class="zc-field"><label><span data-ku="تێبینی" data-ar="ملاحظات" data-en="Description"></span><span class="zc-opt" data-ku="ئارەزوومەندانە" data-ar="اختياري" data-en="Optional"></span></label><textarea id="description"></textarea></div><button class="zc-btn gold" id="submitListing" type="submit" data-ku="ناردن بۆ پشکنین" data-ar="إرسال للمراجعة" data-en="Send for review"></button><div id="sellStatus" class="zc-status"></div></form></div></div>
<div class="zc-modal" id="detailModal"><div class="zc-sheet"><div class="zc-sheet-head"><div><div class="zc-kicker">ZEBAZ CARS</div><h2 id="detailTitle"></h2></div><button class="zc-close" type="button">×</button></div><div id="detailBody"></div></div></div>
<script src="/site.js"></script><script>
(()=>{const $=id=>document.getElementById(id),lang=()=>window.ZebazLang?.get?.()||'ku',tr=(ku,ar,en)=>lang()==='ar'?ar:lang()==='en'?en:ku;let cars=[],photos=[];const sell=$('sellModal'),detail=$('detailModal');function modal(el,on){el.classList.toggle('open',on);document.body.style.overflow=on?'hidden':''}document.querySelectorAll('.zc-close').forEach(b=>b.onclick=()=>modal(b.closest('.zc-modal'),false));[sell,detail].forEach(x=>x.addEventListener('click',e=>{if(e.target===x)modal(x,false)}));$('openSell').onclick=()=>modal(sell,true);
const money=v=>{const s=String(v||'').trim();return s?(/^\$/.test(s)?s:'$'+s):'—'};const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};
async function loadCars(){try{const r=await fetch('/api/cars',{cache:'no-store'}),j=await r.json();cars=j.cars||[];filters();render()}catch{$('carsGrid').innerHTML='<div class="zc-empty">Could not load cars.</div>'}}function filters(){const uniq=k=>[...new Set(cars.map(x=>String(x[k]||'').trim()).filter(Boolean))].sort();$('makeFilter').innerHTML='<option value="">'+tr('هەموو براندەکان','كل الماركات','All makes')+'</option>'+uniq('make').map(x=>'<option>'+esc(x)+'</option>').join('');$('yearFilter').innerHTML='<option value="">'+tr('هەموو ساڵەکان','كل السنوات','All years')+'</option>'+uniq('year').sort((a,b)=>b-a).map(x=>'<option>'+esc(x)+'</option>').join('');$('cityFilter').innerHTML='<option value="">'+tr('هەموو شارەکان','كل المدن','All cities')+'</option>'+uniq('city').map(x=>'<option>'+esc(x)+'</option>').join('')}
function render(){const q=$('search').value.trim().toLowerCase(),mk=$('makeFilter').value,yr=$('yearFilter').value,ct=$('cityFilter').value;const list=cars.filter(x=>(!q||[x.make,x.model,x.year,x.city,x.color].some(v=>String(v||'').toLowerCase().includes(q)))&&(!mk||x.make===mk)&&(!yr||String(x.year)===yr)&&(!ct||x.city===ct));$('carsGrid').innerHTML=list.map(x=>'<article class="zc-card" data-id="'+esc(x.id)+'"><div class="zc-photo" style="background-image:url(\''+esc(x.coverUrl||'')+'\')"><span class="zc-ai">AI PHOTO</span><span class="zc-price">'+esc(money(x.price))+'</span></div><div class="zc-body"><h3>'+esc(x.make+' '+x.model)+'</h3><div class="zc-meta"><span>'+esc(x.year)+'</span><span>'+esc(x.mileage||'—')+'</span><span>'+esc(x.city||'—')+'</span></div></div></article>').join('')||'<div class="zc-empty">'+tr('هیچ ئۆتۆمبێلێک نەدۆزرایەوە.','لم يتم العثور على سيارات.','No cars found.')+'</div>';document.querySelectorAll('.zc-card').forEach(c=>c.onclick=()=>show(c.dataset.id))}
function show(id){const x=cars.find(c=>c.id===id);if(!x)return;$('detailTitle').textContent=x.make+' '+x.model;const imgs=(x.imageUrls||[]).slice(0,5);$('detailBody').innerHTML='<div class="zc-detail-gallery">'+imgs.map(u=>'<img src="'+esc(u)+'" alt="car">').join('')+'</div><div class="zc-detail-info"><div class="zc-chip"><small>'+tr('نرخ','السعر','Price')+'</small><b>'+esc(money(x.price))+'</b></div><div class="zc-chip"><small>'+tr('ساڵ','السنة','Year')+'</small><b>'+esc(x.year)+'</b></div><div class="zc-chip"><small>'+tr('کیلۆمەتر','المسافة','Mileage')+'</small><b>'+esc(x.mileage||'—')+'</b></div><div class="zc-chip"><small>'+tr('شار','المدينة','City')+'</small><b>'+esc(x.city||'—')+'</b></div><div class="zc-chip"><small>'+tr('ڕەنگ','اللون','Color')+'</small><b>'+esc(x.color||'—')+'</b></div><div class="zc-chip"><small>'+tr('فرۆشیار','البائع','Seller')+'</small><b>'+esc(x.sellerName||'Private Seller')+'</b></div></div><p style="color:#999;line-height:1.8">'+esc(x.description||'')+'</p><div class="zc-contact"><a href="tel:'+esc(x.phone)+'">'+tr('پەیوەندی بە فرۆشیار','اتصل بالبائع','Call seller')+' • '+esc(x.phone)+'</a></div>';modal(detail,true)}
['search','makeFilter','yearFilter','cityFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('clearFilters').onclick=()=>{$('search').value='';$('makeFilter').value=$('yearFilter').value=$('cityFilter').value='';render()};
$('pickPhotos').onclick=()=>$('photos').click();$('photos').addEventListener('change',async e=>{const incoming=[...e.target.files].filter(f=>f.type.startsWith('image/')).slice(0,5-photos.length);$('pickPhotos').disabled=true;$('sellStatus').textContent=tr('وێنەکان بە AI ڕێکدەخرێن...','تتم معالجة الصور بالذكاء الاصطناعي...','AI is preparing photos...');for(const f of incoming){try{photos.push(await smartPhoto(f))}catch{}}$('pickPhotos').disabled=false;$('sellStatus').textContent='';e.target.value='';renderPhotos()});function renderPhotos(){$('photoGrid').innerHTML=photos.map((u,i)=>'<div class="zc-thumb"><img src="'+u+'"><button type="button" data-rm="'+i+'">×</button><span>AI 1:1 • '+(i+1)+'</span></div>').join('');document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{photos.splice(Number(b.dataset.rm),1);renderPhotos()})}
async function bitmap(file){if('createImageBitmap'in window)return createImageBitmap(file);return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=reject;im.src=u})}async function aiFocus(file){try{const data=await fileData(file,960,.72,false);const r=await fetch('/api/vehicle-focus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data})});const j=await r.json();if(r.ok&&j.ok&&Number.isFinite(j.x)&&Number.isFinite(j.y))return{x:Math.max(0,Math.min(1,j.x)),y:Math.max(0,Math.min(1,j.y))}}catch{}return{x:.5,y:.5}}async function smartPhoto(file){const [img,focus]=await Promise.all([bitmap(file),aiFocus(file)]),w=img.width||img.naturalWidth,h=img.height||img.naturalHeight,s=Math.min(w,h);let sx=Math.max(0,Math.min(w-s,focus.x*w-s/2)),sy=Math.max(0,Math.min(h-s,focus.y*h-s/2));const c=document.createElement('canvas');c.width=c.height=900;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.filter='contrast(1.045) saturate(1.04) brightness(1.02)';x.drawImage(img,sx,sy,s,s,0,0,900,900);x.filter='none';if(img.close)img.close();return await canvasData(c,.82)}function canvasData(c,q){return new Promise(r=>c.toBlob(b=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)},'image/jpeg',q))}async function fileData(file,max=960,q=.72,square=false){const img=await bitmap(file),w=img.width||img.naturalWidth,h=img.height||img.naturalHeight,scale=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(img.close)img.close();return canvasData(c,q)}
$('sellForm').addEventListener('submit',async e=>{e.preventDefault();const vin=$('vin').value.trim().toUpperCase();if(vin&&vin.length!==17){$('sellStatus').textContent=tr('ئەگەر VIN دابنێیت، دەبێت 17 پیت/ژمارە بێت.','إذا أدخلت VIN فيجب أن يكون 17 خانة.','If entered, VIN must be 17 characters.');return}if(!photos.length){$('sellStatus').textContent=tr('لانیکەم یەک وێنە دابنێ.','أضف صورة واحدة على الأقل.','Add at least one photo.');return}const b=$('submitListing');b.disabled=true;$('sellStatus').textContent=tr('دەنێردرێت...','جارٍ الإرسال...','Sending...');const payload={sellerName:$('sellerName').value.trim(),phone:$('sellerPhone').value.trim(),make:$('make').value.trim(),model:$('model').value.trim(),year:$('year').value.trim(),price:$('price').value.trim(),mileage:$('mileage').value.trim(),city:$('city').value.trim(),color:$('color').value.trim(),vin,description:$('description').value.trim(),language:lang(),images:photos};try{const r=await fetch('/api/cars',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok||!j.ok)throw 0;$('sellStatus').textContent=tr('داواکارییەکەت نێردرا ✅ دوای پشکنین بڵاودەکرێتەوە.','تم إرسال إعلانك ✅ وسيُنشر بعد المراجعة.','Listing sent ✅ It will publish after review.');$('sellForm').reset();photos=[];renderPhotos();setTimeout(()=>modal(sell,false),1600)}catch{$('sellStatus').textContent=tr('هەڵەیەک ڕوویدا، دووبارە هەوڵ بدە.','حدث خطأ، حاول مرة أخرى.','Something went wrong. Try again.')}finally{b.disabled=false}});loadCars()})();
</script></body></html>
