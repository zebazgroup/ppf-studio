n><span class="chip">PPF</span><span class="chip">4x4 & EV</span><span class="chip">FB Oil</span></div></div></section><section class="section"><div class="wrap"><div class="eyebrow">AI</div><h2 class="title" data-ku="یاریدەدەری تایبەت بە جیهانی ئۆتۆمبێل." data-ar="مساعد متخصص بعالم السيارات." data-en="A specialist assistant for the automotive world."></h2><p class="lead" data-ku="بە کوردی، عەرەبی یان ئینگلیزی بنووسە. AI بە هەمان زمان وەڵامت دەداتەوە." data-ar="اكتب بالكردية أو العربية أو الإنجليزية وسيجيبك AI بنفس اللغة." data-en="Write in Kurdish, Arabic or English and AI will answer in the same language."></p><div class="ai-shell"><div class="chat-head"><strong><span class="status-dot"></span>ZEBAZ AI</strong><span id="aiStatus" data-ku="ئامادەیە" data-ar="متصل" data-en="ONLINE"></span></div><div class="messages" id="messages"><div class="msg bot" id="welcome" data-ku="سڵاو، من ZEBAZ AI ـم. هەر پرسیارێکت لەسەر ئۆتۆمبێل، PPF، سووتەمەنی، ڕیکلام یان خزمەتگوزارییەکانی ZEBAZ هەیە بپرسە." data-ar="مرحباً، أنا ZEBAZ AI. اسألني عن السيارات أو PPF أو الوقود أو الإعلانات أو خدمات ZEBAZ." data-en="Hi, I’m ZEBAZ AI. Ask me about cars, PPF, fuel, advertising or ZEBAZ services."></div></div><form class="composer" id="chatForm"><input id="q" maxlength="1800" data-ku-placeholder="پرسیارەکەت بنووسە..." data-ar-placeholder="اكتب سؤالك..." data-en-placeholder="Ask ZEBAZ AI..." autocomplete="off"><button id="send" type="submit" data-ku="ناردن" data-ar="إرسال" data-en="Send"></button></form></div><div class="note" data-ku="وەڵامی AI ڕەنگە هەڵەی تێدا بێت؛ بۆ بڕیاری گرنگی میکانیکی یان کڕین، زانیارییەکە لە پسپۆڕێک پشتڕاست بکەرەوە." data-ar="قد تحتوي إجابات AI على أخطاء؛ تحقق من القرارات الميكانيكية أو الشرائية المهمة مع مختص." data-en="AI answers can contain mistakes. Confirm safety-critical mechanical or purchasing decisions with a qualified source."></div></div></section><footer class="footer"><div class="wrap footer-row"><img class="footer-logo" src="/zebaz-logo.svg" alt="ZEBAZ"><span data-ku="زیرەکی ئۆتۆمبێل" data-ar="ذكاء السيارات" data-en="Automotive Intelligence"></span></div></footer><script src="/site.js"></script><script>const f=document.getElementById('chatForm'),q=document.getElementById('q'),m=document.getElementById('messages'),s=document.getElementById('aiStatus'),b=document.getElementById('send');const history=[];function lang(){return window.ZebazLang?.get?.()||'ku'}function t(ku,ar,en){return lang()==='ar'?ar:lang()==='en'?en:ku}function add(x,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=x;m.appendChild(d);m.scrollTop=m.scrollHeight}f.addEventListener('submit',async e=>{e.preventDefault();const text=q.value.trim();if(!text)return;add(text,'user');q.value='';b.disabled=true;s.textContent=t('بیر دەکاتەوە...','يفكر...','THINKING');const prior=history.slice(-8);try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:prior})});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI unavailable');const answer=j.answer||t('وەڵامێک نەگەڕایەوە.','لم يصل رد.','No answer received.');add(answer,'bot');history.push({role:'user',content:text},{role:'assistant',content:answer});s.textContent=t('ئامادەیە','متصل','ONLINE')}catch(err){add(t('لە ئێستادا ناتوانم وەڵام بدەمەوە، دووبارە هەوڵ بدە.','لا أستطيع الإجابة الآن، حاول مرة أخرى.','AI is temporarily unavailable. Please try again.'),'bot');s.textContent=t('دووبارە هەوڵ بدە','أعد المحاولة','RETRY')}finally{b.disabled=false;q.focus()}});fetch('/status').then(r=>r.json()).then(j=>{s.textContent=j.ai?t('ئامادەیە','متصل','ONLINE'):t('ڕێکخستن','إعداد','SETUP')}).catch(()=>{});</script></body></html>
