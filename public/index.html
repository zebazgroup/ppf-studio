<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>ZEBAZ PPF Studio</title><meta name="description" content="ZEBAZ PPF Studio booking for PPF, polishing, window tint and automotive advertising in Erbil."><link rel="canonical" href="https://zebaz.co/ppf"><link rel="stylesheet" href="/division.css"></head><body data-title-ku="ZEBAZ PPF | داواکاری خزمەتگوزاری" data-title-ar="ZEBAZ PPF | طلب خدمة" data-title-en="ZEBAZ PPF | Service Booking"><div class="lang-gate" data-lang-gate><div class="gate-box"><img class="gate-logo" src="/zebaz-logo.svg" alt="ZEBAZ"><p class="muted">زمانەکەت هەڵبژێرە • اختر لغتك • Choose your language</p><div class="gate-langs"><button data-lang="ku">☀️ کوردی</button><button data-lang="ar">🇮🇶 العربية</button><button data-lang="en">🇬🇧 English</button></div></div></div><header class="top"><div class="wrap nav"><a class="brand-row" href="/"><img class="brand-logo" src="/zebaz-logo.svg" alt="ZEBAZ"><span class="division-name">PPF STUDIO</span></a><div class="navlinks"><a href="/" data-ku="سەرەکی" data-ar="الرئيسية" data-en="Home"></a><a href="/studio" data-ku="ستودیۆ" data-ar="الاستوديو" data-en="Studio"></a><div class="langpick"><button data-lang="ku">کوردی</button><button data-lang="ar">ع</button><button data-lang="en">EN</button></div></div></div></header><section class="hero"><div class="wrap hero-in"><div class="eyebrow" data-ku="پاراستن • جوانکاری • میدیا" data-ar="حماية • عناية • إعلام" data-en="PROTECTION • CARE • MEDIA"></div><h1 data-ku-html="ئۆتۆمبێلەکەت<br><span class='gold'>بپارێزە و پێشانی بدە.</span>" data-ar-html="احمِ سيارتك<br><span class='gold'>واعرضها بأفضل صورة.</span>" data-en-html="Protect your car.<br><span class='gold'>Present it better.</span>"></h1><p data-ku="PPF، پۆلیش، ڕەشکردنی جام، ڕیکلام و ڕیڤیوی پیشەیی ئۆتۆمبێل. داواکارییەکەت ڕاستەوخۆ لە سیستەمی ZEBAZ تۆمار دەکرێت." data-ar="PPF والتلميع وتظليل الزجاج والإعلان والمراجعة الاحترافية للسيارة. يتم تسجيل طلبك مباشرة في نظام ZEBAZ." data-en="PPF, polishing, window tint, automotive advertising and professional reviews. Your request is registered directly in the ZEBAZ system."></p><div class="actions"><a class="cta primary" href="#book" data-ku="تۆمارکردنی داواکاری" data-ar="تسجيل الطلب" data-en="Register request"></a></div></div></section><section class="section"><div class="wrap"><div class="eyebrow" data-ku="خزمەتگوزارییەکان" data-ar="الخدمات" data-en="SERVICES"></div><h2 class="title" data-ku="خزمەتگوزارییەک هەڵبژێرە." data-ar="اختر الخدمة المناسبة." data-en="Choose your service."></h2><div class="grid"><div class="card"><span class="num">01</span><h3>PPF</h3><p data-ku="فیلمی پاراستنی بۆیە بۆ کەمکردنەوەی زیانی ڕووکار." data-ar="فيلم حماية الطلاء لتقليل أضرار السطح." data-en="Paint protection film for long-term exterior protection."></p></div><div class="card"><span class="num">02</span><h3 data-ku="پۆلیش" data-ar="التلميع" data-en="Polishing"></h3><p data-ku="جوانکردن و گەڕاندنەوەی بریقەی بۆیە." data-ar="تحسين الطلاء واستعادة اللمعان." data-en="Paint correction and gloss restoration."></p></div><div class="card"><span class="num">03</span><h3 data-ku="ڕەشکردنی جام" data-ar="تظليل الزجاج" data-en="Window Tint"></h3><p data-ku="ڕەشکردنی پیشەیی جامی ئۆتۆمبێل." data-ar="تظليل احترافي لزجاج السيارة." data-en="Professional automotive window tinting."></p></div><div class="card wide"><span class="num">04</span><h3 data-ku="ڕیکلام و ڕیڤیوی ئۆتۆمبێل" data-ar="إعلان ومراجعة السيارة" data-en="Car Advertising & Review"></h3><p data-ku="Barzan Sleman ڕیڤیوی پیشەیی بۆ ئۆتۆمبێلەکەت دەکات و لە TikTok، Instagram و Facebook نمایشی دەکات بۆ گەیشتن بە ژمارەیەکی زۆر لە بینەران." data-ar="يقوم Barzan Sleman بعمل مراجعة احترافية لسيارتك وعرضها على TikTok وInstagram وFacebook للوصول إلى عدد كبير من المشاهدين." data-en="Barzan Sleman professionally reviews your car and showcases it across TikTok, Instagram and Facebook to reach a large audience."></p></div></div></div></section><section class="section alt" id="book"><div class="wrap"><div class="eyebrow" data-ku="داواکاری" data-ar="الطلب" data-en="BOOKING"></div><h2 class="title" data-ku="زانیارییەکانت تۆمار بکە." data-ar="سجل معلوماتك." data-en="Register your request."></h2><div class="form-card"><form id="bookingForm"><div class="form-grid"><div class="field"><label data-ku="ناوی سیانی" data-ar="الاسم الكامل" data-en="Full Name"></label><input id="name" required autocomplete="name"></div><div class="field"><label data-ku="ژمارەی مۆبایل" data-ar="رقم الهاتف" data-en="Phone Number"></label><input id="phone" type="tel" required autocomplete="tel"></div><div class="field"><label data-ku="جۆر و مۆدێلی ئۆتۆمبێل" data-ar="نوع وموديل السيارة" data-en="Car Make & Model"></label><input id="car" required></div><div class="field"><label data-ku="ساڵی مۆدێل" data-ar="سنة الموديل" data-en="Model Year"></label><input id="year" required inputmode="numeric"></div></div><div class="field"><label data-ku="ژمارەی VIN ـی ئۆتۆمبێل" data-ar="رقم VIN للسيارة" data-en="Vehicle VIN Number"></label><input id="vin" maxlength="17" minlength="17" required style="direction:ltr;text-transform:uppercase" data-ku-placeholder="17 پیت/ژمارە" data-ar-placeholder="17 خانة" data-en-placeholder="17 characters"></div><div class="field"><label data-ku="خزمەتگوزاری" data-ar="الخدمة" data-en="Service"></label><select id="service" required><option value="" data-ku="هەڵبژێرە" data-ar="اختر" data-en="Choose"></option><option value="ppf" data-type="ppf" data-ku="PPF ـ پاراستنی بۆیە" data-ar="PPF - حماية الطلاء" data-en="Paint Protection Film (PPF)"></option><option value="polish" data-type="ppf" data-ku="پۆلیش" data-ar="تلميع السيارة" data-en="Car Polishing"></option><option value="tint" data-type="ppf" data-ku="ڕەشکردنی جام" data-ar="تظليل الزجاج" data-en="Window Tint"></option><option value="review" data-type="studio" data-ku="ڕیکلام و ڕیڤیوی ئۆتۆمبێل" data-ar="إعلان ومراجعة السيارة" data-en="Car Advertising & Review"></option></select></div><div class="field"><label data-ku="تێبینی" data-ar="ملاحظات" data-en="Notes"></label><textarea id="notes" data-ku-placeholder="هەر زانیارییەکی زیادە..." data-ar-placeholder="أي معلومات إضافية..." data-en-placeholder="Any additional information..."></textarea></div><button id="submitBtn" class="submit" type="submit" data-ku="تۆمارکردنی داواکاری" data-ar="تسجيل الطلب" data-en="Register Request"></button><div id="formStatus" class="statusline"></div></form></div></div></section><footer class="footer"><div class="wrap footer-row"><img class="footer-logo" src="/zebaz-logo.svg" alt="ZEBAZ"><div class="phones"><a href="tel:07502122220">0750 212 2220</a><a href="tel:07502122022">0750 212 2022</a></div></div></footer><script src="/site.js"></script><script>const $=id=>document.getElementById(id);function lang(){return window.ZebazLang?.get?.()||'ku'}function tr(ku,ar,en){return lang()==='ar'?ar:lang()==='en'?en:ku}$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();const vin=$('vin').value.trim().toUpperCase();if(vin.length!==17){$('formStatus').textContent=tr('VIN دەبێت 17 پیت/ژمارە بێت.','يجب أن يتكون VIN من 17 خانة.','VIN must be 17 characters.');return}const op=$('service').selectedOptions[0];const booking={name:$('name').value.trim(),phone:$('phone').value.trim(),car:$('car').value.trim(),year:$('year').value.trim(),vin,service:op.textContent.trim(),serviceCode:op.value,requestType:op.dataset.type||'ppf',notes:$('notes').value.trim(),date:new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date()),language:lang()};const btn=$('submitBtn');btn.disabled=true;$('formStatus').textContent=tr('تۆمار دەکرێت...','جارٍ التسجيل...','Saving...');try{const r=await fetch('/send-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Failed');$('formStatus').textContent=tr('داواکارییەکەت بە سەرکەوتوویی تۆمار کرا ✅','تم تسجيل طلبك بنجاح ✅','Your request has been registered successfully ✅');$('bookingForm').reset()}catch{$('formStatus').textContent=tr('هەڵەیەک ڕوویدا، دووبارە هەوڵ بدە.','حدث خطأ، حاول مرة أخرى.','Something went wrong. Please try again.')}finally{btn.disabled=false}});</script></body></html>
