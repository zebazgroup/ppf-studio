<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>ZEBAZ PPF Studio</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070707;color:#fff;font-family:Arial,Tahoma,sans-serif}.hidden{display:none!important}.container,.nav{width:min(1120px,92%);margin:auto}.lang-screen{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 0,#302816,#0a0a0a 44%,#000);display:flex;align-items:center;justify-content:center;padding:20px}.lang-box{text-align:center;width:min(700px,100%)}.logo{font-size:clamp(58px,14vw,104px);font-weight:1000;letter-spacing:9px}.lang-sub{color:#999}.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.lang{background:#101010;border:1px solid #303030;border-radius:18px;padding:22px;color:#fff;font-weight:900;font-size:16px;cursor:pointer;transition:.2s}.lang:hover{border-color:#d7b66d;transform:translateY(-2px)}.flag{display:block;font-size:32px;margin-bottom:8px}.top{position:sticky;top:0;z-index:20;background:#070707e8;backdrop-filter:blur(14px);border-bottom:1px solid #222}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:1000;letter-spacing:3px}.gold{color:#d7b66d}.change{background:#111;border:1px solid #333;color:#fff;border-radius:999px;padding:10px 14px;cursor:pointer}.hero{min-height:72vh;display:flex;align-items:center;background:radial-gradient(circle at 78% 18%,#302714,#0b0b0b 37%,#070707 68%);border-bottom:1px solid #1d1d1d}.hero-inner{padding:80px 0}.eyebrow{color:#d7b66d;font-weight:900;font-size:12px;letter-spacing:2.5px}.hero h1{font-size:clamp(45px,8vw,86px);line-height:1.02;margin:12px 0 20px;max-width:900px}.hero p{color:#aaa;font-size:18px;line-height:1.9;max-width:760px}.cta,.submit{display:inline-block;background:#d7b66d;color:#090909;border:0;border-ra ss="lang-box"><div class="logo">ZEBAZ</div><p class="lang-sub">زمانەکەت هەڵبژێرە • اختر لغتك • Choose your language</p><div class="langs"><button class="lang" onclick="chooseLang('ku')"><span class="flag">☀️</span>کوردی</button><button class="lang" onclick="chooseLang('ar')"><span class="flag">🇮🇶</span>العربية</button><button class="lang" onclick="chooseLang('en')"><span class="flag">🇬🇧</span>English</button></div></div></div><div id="site" class="hidden"><header class="top"><div class="nav"><div class="brand">ZEBAZ <span class="gold">PPF STUDIO</span></div><button class="change" onclick="showLanguages()" id="changeLang"></button></div></header><section class="hero"><div class="container hero-inner"><div class="eyebrow">PREMIUM AUTOMOTIVE STUDIO • ERBIL</div><h1 data-t="hero"></h1><p data-t="heroSub"></p><a href="#book" class="cta" data-t="book"></a></div></section><section class="section"><div class="container"><div class="eyebrow" data-t="our"></div><h2 class="title" data-t="services"></h2><div class="services"><div class="service"><div class="num">01</div><h3 data-t="ppf"></h3></div><div class="service"><div class="num">02</div><h3 data-t="polish"></h3></div><div class="service"><div class="num">03</div><h3 data-t="tint"></h3></div><div class="service review"><div class="num">04</div><h3 data-t="review"></h3><p data-t="reviewD"></p></div></div></div></div></section><section class="section booking" id="book"><div class="container"><div class="eyebrow" data-t="reserve"></div><h2 class="title" data-t="reserveTitle"></h2><div class="card"><form id="f"><div class="grid"><div class="field"><label data-t="name"></label><input id="name" required></div><div class="field"><label data-t="phone"></label><input id="phone" type="tel" required></div><div class="field"><label data-t="car"></label><input id="car" required></div><div class="field"><label data-t="year"></label><input id="year" required></div></div><div class="field"><label>VIN Number</label><input id="vin" maxlength="17" minlength="17" required style="direction:ltr;text-transform:uppercase" placeholder="17 characters"></div><div class="field"><label data-t="service"></label><select id="service" required><option value="" id="op0"></option><option id="op1"></option><option id="op2"></option><option id="op3"></option><option id="op4"></option></select></div><div class="field"><label data-t="notes"></label><textarea id="notes"></textarea></div><button id="submitBtn" class="submit" type="submit" data-t="send"></button><div id="status" class="status"></div></form></div></div></section><footer class="footer"><strong>ZEBAZ PPF STUDIO</strong><div>Erbil • Kurdistan</div><div class="phones" dir="ltr"><a href="tel:07502122220">0750 212 2220</a><a href="tel:07502122022">0750 212 2022</a></div></footer></div><script>const T={ku:{hero:'ئۆتۆمبێلەکەت بە شێوەیەکی جیاواز پیشان بدە.',heroSub:'خزمەتگوزاری پیشەیی PPF، پۆلیش، ڕەشکردنی جام و ڕیڤیوی ئۆتۆمبێل لە ZEBAZ.',book:'داواکاری بنێرە',our:'خزمەتگوزارییەکانمان',services:'خزمەتگوزاری هەڵبژێرە',ppf:'پاراستنی بۆیە (PPF)',polish:'پۆلیش',tint:'ڕەشکردنی جام',review:'ریکلام و ڕیڤیوی ئۆتۆمبێل',reviewD:'Barzan Sleman ڕیڤیوی پیشەیی بۆ ئۆتۆمبێلەکەت دەکات و لە پلاتفۆرمەکانی TikTok، Instagram و Facebook نمایشی دەکات بۆ گەیشتن بە ژمارەیەکی زۆر لە بینەران.',reserve:'داواکاری',reserveTitle:'داواکارییەکەت تۆمار بکە',name:'ناوی سیانی',phone:'ژمارەی مۆبایل',car:'جۆر و مۆدێلی ئۆتۆمبێل',year:'ساڵی مۆدێل',service:'خزمەتگوزاری',notes:'تێبینی',send:'تۆمارکردنی داواکاری',lang:'کوردی ☀️',sending:'تۆمار دەکرێت...',success:'داواکارییەکەت بە سەرکەوتوویی تۆمار کرا ✅',error:'هەڵەیەک ڕوویدا. تکایە دووبارە هەوڵ بدە.',vinError:'VIN دەبێت 17 پیت/ژمارە بێت',ops:['هەڵبژێرە','پاراستنی بۆیە (PPF)','پۆلیش','ڕەشکردنی جام','ریکلام و ڕیڤیوی ئۆتۆمبێل']},ar:{hero:'اعرض سيارتك بطريقة مختلفة.',heroSub:'خدمات احترافية لحماية الطلاء والتلميع وتظليل الزجاج ومراجعة السيارات في ZEBAZ.',book:'أرسل طلبك',our:'خدماتنا',services:'اختر الخدمة',ppf:'حماية الطلاء (PPF)',polish:'تلميع السيارة',tint:'تظليل الزجاج',review:'إعلان ومراجعة السيارة',reviewD:'يقوم Barzan Sleman بعمل مراجعة احترافية لسيارتك وعرضها على TikTok وInstagram وFacebook للوصول إلى عدد كبير من المشاهدين.',reserve:'الحجز',reserveTitle:'سجل طلبك',name:'الاسم الكامل',phone:'رقم الهاتف',car:'نوع وموديل السيارة',year:'سنة الموديل',service:'الخدمة',notes:'ملاحظات',send:'تسجيل الطلب',lang:'العربية 🇮🇶',sending:'جارٍ التسجيل...',success:'تم تسجيل طلبك بنجاح ✅',error:'حدث خطأ. يرجى المحاولة مرة أخرى.',vinError:'يجب أن يتكون VIN من 17 خانة',ops:['اختر','حماية الطلاء (PPF)','تلميع السيارة','تظليل الزجاج','إعلان ومراجعة السيارة']},en:{hero:'Show your car differently.',heroSub:'Premium PPF, polishing, window tinting and professional car review services by ZEBAZ.',book:'Send Request',our:'OUR SERVICES',services:'Choose a service',ppf:'Paint Protection (PPF)',polish:'Car Polishing',tint:'Window Tint',review:'Car Advertising & Review',reviewD:'Barzan Sleman professionally reviews your car and showcases it across TikTok, Instagram and Facebook to reach a large audience.',reserve:'BOOKING',reserveTitle:'Register your request',name:'Full Name',phone:'Phone Number',car:'Car Make & Model',year:'Model Year',service:'Service',notes:'Notes',send:'Register Request',lang:'English 🇬🇧',sending:'Saving...',success:'Your request has been saved successfully ✅',error:'Something went wrong. Please try again.',vinError:'VIN must be 17 characters',ops:['Choose','Paint Protection (PPF)','Car Polishing','Window Tint','Car Advertising & Review']}};let lang='ku';const $=id=>document.getElementById(id);function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';document.querySelectorAll('[data-t]').forEach(x=>x.textContent=T[lang][x.dataset.t]);$('changeLang').textContent='🌐 '+T[lang].lang;T[lang].ops.forEach((x,i)=>$('op'+i).textContent=x)}function chooseLang(l){lang=l;apply();$('langScreen').classList.add('hidden');$('site').classList.remove('hidden')}function showLanguages(){$('site').classList.add('hidden');$('langScreen').classList.remove('hidden')}function data(){const s=$('service');return{name:$('name').value.trim(),phone:$('phone').value.trim(),car:$('car').value.trim(),year:$('year').value.trim(),vin:$('vin').value.trim().toUpperCase(),service:s.options[s.selectedIndex].text,notes:$('notes').value.trim(),date:new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date()),language:lang}}$('f').addEventListener('submit',async e=>{e.preventDefault();const d=data();if(d.vin.length!==17){$('status').textContent=T[lang].vinError;return}const btn=$('submitBtn');btn.disabled=true;$('status').textContent=T[lang].sending;try{const r=await fetch('/send-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking:d})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Failed');$('status').textContent=T[lang].success;$('f').reset();T[lang].ops.forEach((x,i)=>$('op'+i).textContent=x)}catch(err){$('status').textContent=T[lang].error}finally{btn.disabled=false}});</script></body></html>
